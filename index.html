<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin' Starlight Mayhem</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<script type="text/javascript" src="./Starlight Mayhem.js"></script>
	<script>
		window.addEventListener("touchmove", function(event) { event.preventDefault(); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != "undefined" && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
		}
	</script>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
		#openfl-content { background: #000000; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
		#openfl-content canvas { display: block; }
		#mobile-controls { display: none; }
		@media (pointer: coarse), (max-width: 900px) and (hover: none) {
			#mobile-controls { display: block; position: fixed; inset: 0; z-index: 100; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
			#mobile-controls::before { content: ""; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(#86efac, #86efac) top / 100% 5px no-repeat, linear-gradient(#67e8f9, #67e8f9) bottom / 100% 5px no-repeat, linear-gradient(#c084fc, #c084fc) left / 5px 100% no-repeat, linear-gradient(#fda4af, #fda4af) right / 5px 100% no-repeat; box-shadow: inset 0 0 16px rgba(255, 255, 255, .07); pointer-events: none; }
			.touch-pad { position: absolute; z-index: 2; left: calc(16px + env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 10px); pointer-events: none; }
			#mobile-controls button { display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(9, 27, 55, .76); border: 2px solid rgba(126, 235, 255, .88); border-radius: 16px; font: 800 clamp(25px, 6vw, 38px)/1 system-ui, sans-serif; text-shadow: 0 0 12px currentColor, 0 2px 3px #000; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
			.touch-pad button { width: clamp(54px, 13vw, 72px); height: clamp(54px, 13vw, 72px); padding: 0; }
			#mobile-controls [data-key="ArrowLeft"] { color: #d8b4fe; border-color: #c084fc; background: rgba(105, 47, 170, .78); box-shadow: 0 0 14px rgba(168, 85, 247, .58), inset 0 0 12px rgba(192, 132, 252, .2); }
			#mobile-controls [data-key="ArrowDown"] { color: #a5f3fc; border-color: #67e8f9; background: rgba(0, 123, 153, .78); box-shadow: 0 0 14px rgba(34, 211, 238, .58), inset 0 0 12px rgba(103, 232, 249, .2); }
			#mobile-controls [data-key="ArrowUp"] { color: #bbf7d0; border-color: #86efac; background: rgba(22, 121, 67, .78); box-shadow: 0 0 14px rgba(74, 222, 128, .58), inset 0 0 12px rgba(134, 239, 172, .2); }
			#mobile-controls [data-key="ArrowRight"] { color: #fecdd3; border-color: #fda4af; background: rgba(170, 38, 57, .78); box-shadow: 0 0 14px rgba(248, 74, 93, .58), inset 0 0 12px rgba(253, 164, 175, .2); }
			#mobile-controls button.is-pressed { filter: brightness(1.55); transform: scale(.95); }
			.touch-actions { position: absolute; z-index: 3; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
			#mobile-controls .touch-actions button { width: clamp(68px, 18vw, 82px); height: clamp(44px, 8vh, 58px); padding: 0; border: 2px solid rgba(126, 235, 255, .9); border-radius: 12px; background: rgba(9, 27, 55, .84); box-shadow: 0 0 12px rgba(0, 210, 255, .34); font: 700 clamp(14px, 4vw, 18px)/1 system-ui, sans-serif; pointer-events: auto; }
			#mobile-hint { position: absolute; z-index: 1; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: 92vw; padding: 6px 10px; border-radius: 12px; color: #fff; background: rgba(0, 0, 0, .56); font: 600 12px/1.3 system-ui, sans-serif; text-align: center; white-space: nowrap; pointer-events: none; }
		}
		@media (pointer: coarse) and (orientation: landscape) { #mobile-hint { display: none; } }
		@font-face { font-family: 'Blank River'; src: url('assets/fonts/Blank River.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'p5hatty'; src: url('assets/fonts/p5hatty.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Pixel Arial 11 Bold'; src: url('assets/fonts/pixel.otf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'VCR OSD Mono'; src: url('assets/fonts/vcr.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Nokia Cellphone FC Small'; src: url('flixel/fonts/nokiafc22.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Monsterrat'; src: url('flixel/fonts/monsterrat.ttf') format('truetype'); font-weight: normal; font-style: normal; }
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		lime.embed("Starlight Mayhem", "openfl-content", 1280, 720, { parameters: {} });
	</script>
	<div id="mobile-controls" aria-label="Touch controls">
		<div id="mobile-hint" aria-hidden="true">画面を横向きにすると遊びやすくなります · 左の縦ボタンで操作</div>
		<div class="touch-pad" aria-label="方向操作">
			<button type="button" data-key="ArrowLeft" aria-label="左へ">◀</button>
			<button type="button" data-key="ArrowDown" aria-label="下へ">▼</button>
			<button type="button" data-key="ArrowUp" aria-label="上へ">▲</button>
			<button type="button" data-key="ArrowRight" aria-label="右へ">▶</button>
		</div>
		<div class="touch-actions" aria-label="メニュー操作">
			<button type="button" data-key="Enter" aria-label="決定">決定</button>
			<button type="button" data-key="Escape" aria-label="戻る">戻る</button>
		</div>
	</div>
	<script type="text/javascript" src="./mobile-controls.js"></script>
</body>
</html>
