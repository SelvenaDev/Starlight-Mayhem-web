<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin' Starlight Mayhem</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<script type="text/javascript" src="./Starlight Mayhem.js"></script>
	<script>
		window.addEventListener("touchmove", function(event) { event.preventDefault(); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != "undefined" && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
		}
	</script>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
		#openfl-content { background: #000000; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
		#openfl-content canvas { display: block; }
		#mobile-controls { display: none; }
		@media (pointer: coarse), (max-width: 900px) and (hover: none) {
			#mobile-controls { display: block; position: fixed; inset: 0; z-index: 100; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
			#mobile-controls::before { content: ""; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(rgba(134, 239, 172, .68), rgba(134, 239, 172, .68)) top / 100% 3px no-repeat, linear-gradient(rgba(103, 232, 249, .68), rgba(103, 232, 249, .68)) bottom / 100% 3px no-repeat, linear-gradient(rgba(192, 132, 252, .68), rgba(192, 132, 252, .68)) left / 3px 100% no-repeat, linear-gradient(rgba(253, 164, 175, .68), rgba(253, 164, 175, .68)) right / 3px 100% no-repeat; pointer-events: none; }
			.touch-lanes { position: absolute; z-index: 2; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); pointer-events: none; }
			#mobile-controls button { display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(9, 27, 55, .22); border: 0; border-radius: 0; font: 800 clamp(42px, 10vw, 68px)/1 system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0, 0, 0, .85); pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
			.touch-lane { width: 100%; height: 100%; box-sizing: border-box; align-items: flex-end !important; justify-content: center !important; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); border: 1px solid var(--lane-border) !important; background: var(--lane-bg) !important; }
			#mobile-controls [data-key="ArrowLeft"] { --lane-border: rgba(192, 132, 252, .46); --lane-bg: rgba(105, 47, 170, .045); color: #d8b4fe; }
			#mobile-controls [data-key="ArrowDown"] { --lane-border: rgba(103, 232, 249, .46); --lane-bg: rgba(0, 123, 153, .045); color: #a5f3fc; }
			#mobile-controls [data-key="ArrowUp"] { --lane-border: rgba(134, 239, 172, .46); --lane-bg: rgba(22, 121, 67, .045); color: #bbf7d0; }
			#mobile-controls [data-key="ArrowRight"] { --lane-border: rgba(253, 164, 175, .46); --lane-bg: rgba(170, 38, 57, .045); color: #fecdd3; }
			#mobile-controls button.is-pressed { filter: brightness(1.3); }
			.touch-actions { position: absolute; z-index: 3; right: calc(14px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
			#mobile-controls .touch-actions button { width: clamp(68px, 18vw, 82px); height: clamp(44px, 8vh, 58px); padding: 0; border: 1px solid rgba(126, 235, 255, .72); border-radius: 10px; background: rgba(9, 27, 55, .58); box-shadow: none; font: 700 clamp(14px, 4vw, 18px)/1 system-ui, sans-serif; pointer-events: auto; }
			#mobile-hint { position: absolute; z-index: 1; top: calc(10px + env(safe-area-inset-top)); left: 25%; width: 50%; padding: 6px 8px; border-radius: 12px; color: #fff; background: rgba(0, 0, 0, .56); font: 600 12px/1.3 system-ui, sans-serif; text-align: center; white-space: normal; pointer-events: none; }
		}
		@media (pointer: coarse) and (orientation: landscape) { #mobile-hint { display: none; } }
		@font-face { font-family: 'Blank River'; src: url('assets/fonts/Blank River.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'p5hatty'; src: url('assets/fonts/p5hatty.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Pixel Arial 11 Bold'; src: url('assets/fonts/pixel.otf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'VCR OSD Mono'; src: url('assets/fonts/vcr.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Nokia Cellphone FC Small'; src: url('flixel/fonts/nokiafc22.ttf') format('truetype'); font-weight: normal; font-style: normal; }
		@font-face { font-family: 'Monsterrat'; src: url('flixel/fonts/monsterrat.ttf') format('truetype'); font-weight: normal; font-style: normal; }
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		lime.embed("Starlight Mayhem", "openfl-content", 1280, 720, { parameters: {} });
	</script>
	<div id="mobile-controls" aria-label="Touch controls">
		<div id="mobile-hint" aria-hidden="true">画面を横向きにすると遊びやすくなります · 色付きの縦列をタップして操作</div>
		<div class="touch-lanes" aria-label="方向操作">
			<button class="touch-lane" type="button" data-key="ArrowLeft" aria-label="左へ">◀</button>
			<button class="touch-lane" type="button" data-key="ArrowDown" aria-label="下へ">▼</button>
			<button class="touch-lane" type="button" data-key="ArrowUp" aria-label="上へ">▲</button>
			<button class="touch-lane" type="button" data-key="ArrowRight" aria-label="右へ">▶</button>
		</div>
		<div class="touch-actions" aria-label="メニュー操作">
			<button type="button" data-key="Enter" aria-label="決定">決定</button>
			<button type="button" data-key="Escape" aria-label="戻る">戻る</button>
		</div>
	</div>
	<script type="text/javascript" src="./mobile-controls.js"></script>
</body>
</html>
